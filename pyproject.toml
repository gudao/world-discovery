[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-discovery-mujoco"
version = "0.1.0"
description = "Auditable experiments in active physical discovery with MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2,<4", "numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
world-discovery = "world_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
